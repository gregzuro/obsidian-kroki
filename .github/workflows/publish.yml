name: Release

on:
  push:
    # Trigger on tag push. Use the bare version as the tag, e.g. `1.3.0`,
    # so it matches `manifest.json`'s `version` (what Obsidian's plugin
    # updater looks for).
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for `actions/attest-build-provenance` to mint and upload
      # the artifact attestation that proves these binaries came from this
      # workflow run.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + esbuild)
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # Use the per-tag notes checked into the repo; fall back to
          # auto-generated commit notes if RELEASE_NOTES.md is missing.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
