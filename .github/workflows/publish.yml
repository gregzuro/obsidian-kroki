name: Release

on:
  push:
    # Trigger on tag push. Use the bare version as the tag, e.g. `1.3.0`,
    # so it matches `manifest.json`'s `version` (what Obsidian's plugin
    # updater looks for).
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build (tsc + esbuild)
        run: npm run build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
